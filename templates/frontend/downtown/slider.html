{% load static %}
{% load i18n %}



		 <!-- Banner Area -->
        <div class="banner-area-two">
            <div class="d-table">
                <div class="d-table-cell">
                    <div class="container">
                        <div class="banner-content banner-content-ptb text-center">
                            <p>Find Your Suburb</p>
                            <h1 class="margin-auto">Find Your <b> Amazing City</b></h1>
                            <div class="banner-form">
                                <form>
                                    <div class="row justify-content-center">
                                        <div class="col-lg-2 col-md-4">
                                            <div class="form-group">
                                                <i class='flaticon-place'></i>
                                                <input class="form-control" type="text" placeholder="Location">
                                            </div>
                                        </div>

                                        <div class="col-lg-4 col-md-4">
                                            <div class="form-group">
                                                <i class='flaticon-vision'></i>
                                                <input class="form-control" type="text"  placeholder="What are looking for?">
                                            </div>
                                        </div>

                                        <div class="col-lg-4 col-md-4">
                                            <div class="form-group">
                                                <i class='flaticon-category'></i>
                                                <select class="form-control">
                                                    <option>All Categories</option>
                                                    <option>Restaurants</option>
                                                    <option>Events</option>
                                                    <option>Hotels</option>
                                                </select>
                                            </div>
                                        </div>

                                        <div class="col-lg-2 col-sm-6  ">
                                            <button type="submit" class="default-btn">
                                                Search
                                                <i class="flaticon-loupe"></i>
                                            </button>
                                        </div>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="banner-img">
                <img src="{%  static '' %}{{FRONTEND_ASSETS}}/img/home-three/home-three2.png" alt="Images">
            </div>
        </div>
        <!-- Banner Area End -->
