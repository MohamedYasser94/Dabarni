{% load i18n %}
{% load static %}
{% get_current_language as LANGUAGE_CODE %}
 <!--begin::Language-->

                    <!--begin::Menu- wrapper-->
                    <form action="{% url 'set_language' %}" method="post"
                          id="language-form"
                          name="language-form">
                        {% csrf_token %}
                        <input type="hidden" name="language" id="language" value=""/>
                    </form>
                    <script>
                        function set_language(code) {
                            document.getElementById('language').value = code;
                            document.getElementById('language-form').submit();

                        }
                    </script>
                    {% if  LANGUAGE_CODE == 'en' %}

                        <a
                           href="javascript:set_language('ar')">
                        	<li class="header-theme me-3">
                            <img src="{% static '' %}{{ BACKEND_ASSETS }}/media/flags/kuwait.svg"
                                 alt="{{ en_language.code }}" style="height: 20px;width: 50px ">
                            </li>

                        </a>
                    {% elif LANGUAGE_CODE == 'ar' %}
                        <a href="javascript:set_language('en')">
                        	<li class="header-theme me-3">
                            <img src="{% static '' %}{{ BACKEND_ASSETS }}/media/flags/united-kingdom.svg"
                                 alt="{{ en_language.code }}" style="height: 20px;width: 50px "
                            >
                            </li>
                        </a>


                    {% endif %}
                    <!--begin::Menu-->

                    <!--end::Menu-->
                    <!--end::Menu wrapper-->
