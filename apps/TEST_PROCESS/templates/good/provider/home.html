<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>الوظائف المتاحة</title>
  <style>
    body {
      font-family: "Tahoma", sans-serif;
      background: #f4f6f9;
      margin: 0; padding: 0;
      color: #333;
    }
    .container {
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
    }
    h2 {
      text-align: center;
      color: #3498db;
      margin-bottom: 25px;
    }
    .job-card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      padding: 20px;
      margin-bottom: 20px;
      transition: all 0.3s ease;
    }
    .job-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 14px rgba(0,0,0,0.15);
    }
    .job-title {
      font-size: 18px;
      font-weight: bold;
      color: #2c3e50;
      margin-bottom: 10px;
    }
    .job-info {
      margin: 5px 0;
      font-size: 14px;
      color: #444;
    }
    .status {
      display: inline-block;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
    }
    .status.Pending { background: #f1c40f; color: #fff; }
    .status.Completed { background: #2ecc71; color: #fff; }
    .status.Cancelled { background: #e74c3c; color: #fff; }
    .status.InProgress { background: #3498db; color: #fff; }

    .btn {
      display: inline-block;
      margin-top: 10px;
      padding: 10px 15px;
      background: #3498db;
      color: #fff;
      text-decoration: none;
      border-radius: 6px;
      font-size: 14px;
      transition: 0.3s;
    }
    .btn:hover {
      background: #2980b9;
    }
    .msg {
      text-align: center;
      font-weight: bold;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>الوظائف المتاحة لك</h2>
    <div id="jobsList" class="jobs"></div>
    <div id="msg" class="msg"></div>
  </div>

<script>
async function loadAvailableJobs() {
  try {
    const res = await fetch("/api/v1/provider/jobs/available/", {
      headers: { "Authorization": "Bearer " + localStorage.getItem("access_token") }
    });

    const result = await res.json();
    if (!res.ok) throw new Error(result.message || "فشل تحميل الوظائف");

    const jobsList = document.getElementById("jobsList");
    jobsList.innerHTML = "";

    if (result.data.length === 0) {
      document.getElementById("msg").textContent = "لا توجد وظائف متاحة حالياً ❌";
      return;
    }

    result.data.forEach(job => {
      const card = document.createElement("div");
      card.className = "job-card";

      card.innerHTML = `
        <div class="job-title">${job.title}</div>
        <div class="job-info"><b>الوصف:</b> ${job.description || "لا يوجد"}</div>
        <div class="job-info"><b>السعر:</b> ${job.price} ج.م</div>
        <div class="job-info"><b>المسافة:</b> ${job.distance ? job.distance.toFixed(2) + " كم" : "غير محدد"}</div>
        <div class="job-info"><b>الحالة:</b> <span class="status ${job.status}">${job.status}</span></div>
        <a href="/test/provider/jobs/${job.id}/" class="btn">عرض التفاصيل</a>
      `;
      jobsList.appendChild(card);
    });
  } catch (err) {
    document.getElementById("msg").textContent = "فشل تحميل الوظائف ❌";
    console.error(err);
  }
}

loadAvailableJobs();
</script>
</body>
</html>
