<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>طلباتي</title>
  <style>
    body {
      font-family: 'Tahoma', sans-serif;
      background: #f0f2f5;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 960px;
      margin: 30px auto;
      background: #fff;
      padding: 30px 25px;
      border-radius: 15px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
    }

    h2 {
      text-align: center;
      margin-bottom: 30px;
      font-size: 28px;
      color: #2c3e50;
      position: relative;
    }
    h2::after {
      content: "";
      display: block;
      width: 70px;
      height: 3px;
      background: #3498db;
      margin: 8px auto 0;
      border-radius: 2px;
    }

    .btn-link {
      display: inline-block;
      margin-bottom: 25px;
      padding: 12px 20px;
      background: #3498db;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      transition: 0.3s;
      text-align: center;
    }
    .btn-link:hover {
      background: #217dbb;
    }

    .job-card {
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      background: #fff;
      box-shadow: 0 6px 15px rgba(0,0,0,0.08);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      position: relative;
    }
    .job-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.12);
    }

    .job-card h3 {
      margin: 0 0 12px;
      font-size: 22px;
      color: #2c3e50;
    }
    .job-card p {
      margin: 5px 0;
      color: #555;
      line-height: 1.4;
    }

    .badge {
      display: inline-block;
      padding: 5px 10px;
      border-radius: 5px;
      font-weight: bold;
      font-size: 13px;
      margin-top: 5px;
    }
    .Pending { background: #f1c40f; color: #fff; }
    .Completed { background: #2ecc71; color: #fff; }
    .Cancelled { background: #e74c3c; color: #fff; }
    .InProgress { background: #3498db; color: #fff; }

    .accepted {
      background: #eafaf1;
      border: 1px solid #c7e6d4;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 12px;
      color: #155724;
      font-weight: bold;
      font-size: 14px;
    }

    .actions {
      margin-top: 15px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .actions button {
      flex: 1;
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
      transition: 0.3s;
    }
    .view {
      background: #3498db;
      color: white;
    }
    .view:hover {
      background: #217dbb;
    }
    .cancel {
      background: #e74c3c;
      color: white;
    }
    .cancel:hover {
      background: #c0392b;
    }

    #jobsList {
      font-size: 15px;
      color: #666;
    }

    @media(max-width: 600px) {
      .actions button {
        flex: 100%;
      }
    }
  </style>
</head>
<body>
 
  <div class="container">
    <a href="/test/client/home/" class="btn-link">
      ➕ إنشاء طلب جديد
    </a>
    <h2>طلباتي الحالية</h2>
    <div id="jobsList">جاري التحميل...</div>
  </div>

<script>
async function loadMyJobs() {
  const jobsList = document.getElementById("jobsList");
  try {
    const res = await fetch("/api/v1/customer/jobs/my/", {
      headers: { "Authorization": "Bearer " + localStorage.getItem("access_token") }
    });
    const data = await res.json();

    if (!data.isSuccess) throw new Error(data.message);

    jobsList.innerHTML = "";
    if (data.data && data.data.length > 0) {
      data.data.forEach(job => {
        const accepted = job.accepted && job.accepted.is_accepted;
        const providerName = accepted ? (job.accepted.provider?.name || job.accepted.provider?.username) : null;
        const acceptedPrice = accepted ? job.accepted.price : null;
        const acceptedAt = accepted ? job.accepted.accepted_at : null;

        const status = job.progresses[0]?.progress_status || 'غير محدد';
        const badgeClass = status.replace(/\s+/g, '');

        jobsList.innerHTML += `
          <div class="job-card">
        <h3> <small class="text-muted">${job.category?.title || "غير محدد"}</small></h3>
            <span class="badge ${badgeClass}">${status}</span>
            ${accepted ? `<div class="accepted">✔ تم قبول الطلب من قِبل: ${providerName} ${acceptedPrice ? ` — السعر: ${acceptedPrice}` : ''} ${acceptedAt ? ` — ${new Date(acceptedAt).toLocaleString()}` : ''}</div>` : ''}
            <p><b>الوصف:</b> ${job.description}</p>
            <p><b>السعر المطلوب:</b> ${job.price} ر.س</p>
            <div class="actions">
  <button class="view" onclick="viewJob(${job.id})">👁 عرض</button>
  ${status !== 'Completed' && status !== 'Cancelled' ? `<button class="cancel" onclick="cancelJob(${job.id})">✖ إلغاء</button>` : ''}
</div>

          </div>
        `;
      });
    } else {
      jobsList.textContent = "لا توجد طلبات لعرضها حاليًا.";
    }
  } catch (err) {
    jobsList.textContent = "فشل تحميل الطلبات ❌";
    console.error(err);
  }
}

function viewJob(id) {
  window.location.href = `/test/client/job/${id}/`;
}

async function cancelJob(id) {
  const reason = prompt("ادخل سبب الإلغاء:");
  if (!reason) return;

  try {
    const res = await fetch(`/api/v1/customer/jobs/${id}/cancel/`, {
      method: "POST",
      headers: {
        "Authorization": "Bearer " + localStorage.getItem("access_token"),
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ reason })
    });

    const data = await res.json();
    if (!res.ok) {
      alert(data.message || "فشل الإلغاء");
      return;
    }
    alert("تم إلغاء الطلب ✅");
    loadMyJobs();
  } catch (err) {
    alert("خطأ في الشبكة ❌");
  }
}

loadMyJobs();
</script>
</body>
</html>
