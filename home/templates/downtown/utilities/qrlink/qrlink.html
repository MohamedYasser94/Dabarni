<head>
    <meta charset="UTF-8">
    <title>Mtlop - مطلوب</title>
    <meta name="description" content="Follow us on social media platforms">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Changa:wght@400;700&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <link rel="icon" type="image/png" sizes="16x16" href="https://www.linkin1.com/image/16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="https://www.linkin1.com/image/32x32.png">
    <link rel="icon" type="image/png" sizes="48x48" href="https://www.linkin1.com/image/48x48.png">


    <style>

            html, body {
                min-height: 100vh;
                /* Set min-height to cover the entire viewport */
                margin: 0;
                padding: 0;
            }

            body {
                font-family: 'Changa', sans-serif;
                position: relative;
            }

            body::before {
                content: "";
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: url('https://linkin1.com/templates/wLrtOPPJBqY.jpg');
                background-size: cover;
                background-position: center center;
                z-index: -1;


            }


            .container {
                max-width: 600px;
                margin: 0 auto;
                text-align: center;
                padding: 80px 15px;
                color: #fff;
                padding-bottom: 35px;
                overflow-wrap: break-word;
                word-wrap: break-word;

            }

            ul {
                list-style: none;
                padding: 0;
                margin: 0;
                margin-bottom: 20px;
            }

            li {
                margin-bottom: -5px;
            }




                /* button div */
                #buttons {
                  padding-top: 50px;
                  text-align: center;
                }

                /* start da css for da buttons */
                .btn {
                  border-radius: 5px;
                  padding: 7px 50px;
                  font-size: 22px;
                  text-decoration: none;
                  margin: 12px;
                  color: #000;
                  position: relative;
                  display: inline-block;
                }

                .btn:active {
                  transform: translate(0px, 5px);
                  -webkit-transform: translate(0px, 5px);
                  box-shadow: 0px 1px 0px 0px;
                }

                .btncolor {
                  background-color: #fff;
                  box-shadow: 0px 5px 0px 0px #000;
                }

                .btncolor:hover {
                  background-color: #000;
                    color: #fff;
                   box-shadow: 0px 5px 0px 0px #fff;

                }


            .social-button:hover {
                transform: translateY(-2px);
            }


            .social-button:focus {
                outline: none;
            }

            a i {
                margin-right: 10px;
                font-size: 1.5rem;
                margin-left: 10px;
            }

            /* Control the size of your profile picture */
            .profile-pic {
                border-radius: 50%;
                overflow: hidden;
                width: 180px;
                height: 180px;
                box-shadow: 0px 4px 4px rgba(0, 0, 0, 0.1);
                margin-top: -33px;
                border-radius: 100px;
            }


            h1 {

                margin-bottom: -3px;
                color: #fff;
            }


            .social-button {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                margin: 5px;
                padding: 15px;
                /* Slightly bigger padding */
                color: #fff;
                margin: -1px;
                border: none;
                cursor: pointer;
                font-size: 1.5rem;
                transition: transform 0.2s ease, box-shadow 0.2s ease;
                background: none;
            }

            /* Logo Container */
            .logo-container img {
                cursor: pointer;
                margin-bottom: 18px;
            }

            /* Footer styles */
            footer {
                color: #999;
                font-size: 0.8rem;
                text-align: center;
                bottom: 0;
                background-color: transparent;

            }


            /* Social media icons */
            .social-icons {
                display: flex;
                justify-content: center;
                align-items: center;
                margin-top: 10px;
                margin-bottom: 20px;
                flex-wrap: wrap;
            }

            /* Tilt animation on hover */
            .social-icons a {
                display: inline-block;
                transition: transform 0.3s ease-in-out;
            }

            .social-icons a:hover {
                animation: tilt 0.9s ease-in-out infinite alternate;
            }

            @keyframes tilt {
                0% {
                    transform: rotate(0deg);
                }
                100% {
                    transform: rotate(10deg);
                    /* You can adjust the rotation angle */
                }
            }



            /* Desktop styles */
            @media (min-width: 600px) {



                a {
                    width: 490px;
                }

                /* Style the icon container */
                .icon-container {
                    position: relative;
                }

                /* Style the icons within the icon container */
                .icon-container i {
                    font-size: 1.3rem;
                    top: 5px;
                    left: 5px;
                }


            }

            /* Mobile styles */
            @media (max-width: 600px) {

                .profile-pic {
                    width: 100%;
                    height: auto;
                    max-width: 170px;
                    margin: 15px auto 0px;
                    box-shadow: 0px 4px 4px rgba(0, 0, 0, 0.1);
                }

            .button-wrapper {
                max-width: 100%;
                margin: 0 auto;
                display: flex;
                justify-content: center; /* Center the buttons horizontally */
            }
            .btn.btncolor {
                width: 100%; /* Make the button take up the full width */
            }


             .container {
                max-width: 600px;
                margin: 0 auto;
                text-align: center;
                padding: 40px 5px;
                color: #fff;
                padding-bottom: 35px;
                overflow-wrap: break-word;
                word-wrap: break-word;

            }

        }


                a {

                    position: relative;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                }

                a i {
                    margin-right: 5px;
                    margin-left: 10px;
                    font-size: 1.5rem;
                    vertical-align: middle;
                }

                h1 {
                    margin-bottom: -5px;

                }

                a span {
                    font-size: 1.0rem;
                    letter-spacing: 1px;
                }

                ul li:last-of-type {
                    margin-bottom: 20px;
                }

                /* Style the icon container */
                .icon-container {
                    position: absolute;
                    top: 50%;
                    left: 20px;
                    transform: translateY(-50%);
                }

                /* Style the icons within the icon container */
                .icon-container i {
                    font-size: 1.4rem;
                }

                /* Footer SVG Image */
                .footer-svg {
                    cursor: pointer;
                }
                .overflow-wrap {
                    padding-right: 45px;
                    padding-left: 45px;
                    word-break: break-word;
                }

            }



    </style>
    <meta name="d41d8cd98f00b204e9800998ecf8427e_lib_detect" id="d41d8cd98f00b204e9800998ecf8427e_lib_detect"><script src="moz-extension://ced3ff11-8a58-4bcb-ab5c-59dd2b9ddc63/library/libraries.js"></script><script src="moz-extension://ced3ff11-8a58-4bcb-ab5c-59dd2b9ddc63/content_scripts/lib_detect.js"></script></head>

    <body>
        <div class="container">
           {% if profile.image %}
            <img src="{{ profile.image.url }}" alt="Profile Picture" class="profile-pic">
            {% else %}
            <img src="https://linkin1.com/templates/image/linkin1-profile.jpg" alt="Profile Picture" class="profile-pic">
            {% endif %}
            <h1 style="font-size: 2.0rem;">   {{ profile.name }}</h1>
            <p style="font-size: 0.92rem;">{{ profile.keywords }}</p>

            <!-- Add social media icons -->
            <div class="social-icons">
                 {% for item in social %}
                <button class="social-button" onclick="openLink('#')">
                    <i class="fab fa-{{ item.provider }}"></i>
                </button>
                 {% endfor %}

            </div>

<ul>
                <!-- TikTok -->
                {% for item in social %}
                <li>
                    <div class="button-wrapper">
                    <a href="{{ item.url }}" target="_blank" class="btn btncolor">
                        <div class="icon-container">
                            <i class="fab fa-{{ item.provider }}"></i>
                        </div>
                            <span class="overflow-wrap">{{ item.provider }}</span>
                    </a>
                    </div>
                </li>
                 {% endfor %}
                <!-- WhatsApp -->


            </ul>


        </div>

        <footer style="font-size: 0.9rem; color: #000;">
            <div class="logo-container" id="logoContainer">
                <img class="footer-svg" src="https://digithup.com/static/frontend/arino/assets/img/logodw.svg" alt="Linkin1" width="200" height="150">
            </div>
        </footer>


        <!-- Photo by BoliviaInteligente on Unsplash -->



                <script>
                    // Get the SVG logo element
                    var svgLogo = document.querySelector(".logo-container img");

                    // Add a click event listener to the SVG logo
                    svgLogo.addEventListener("click", function() {
                        // Specify the URL you want to open in a new window
                        var url = "https://www.digithup.com";
                        // Open the URL in a new window
                        window.open(url, "_blank");
                    });
                </script>

            <script>
                // Define the openLink function
                function openLink(url) {
                    window.open(url, "_blank");
                }
            </script>





</body>
</html>
